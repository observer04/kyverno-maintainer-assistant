[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kyverno-maintainer-assistant"
version = "0.1.0"
description = "Guarded, dry-run Kyverno maintainer decision prototype"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "observer04" }]
dependencies = [
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
model = ["openai>=1.100,<3"]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1"]

[project.scripts]
kma = "kma.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kma"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
